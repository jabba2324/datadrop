[package]
name = "datadrop-core"
description = "DataDrop core: connection profiles, SQL parsing and the commands shared by the CLI and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sqlserver"]
# SQL Server, through Microsoft's mssql-tds (which brings OpenSSL on Linux; built from
# source, so the binary doesn't need the system's).
sqlserver = ["dep:mssql-tds", "dep:openssl"]
# DuckDB, embedded (built from its C++ source: slow to compile, and large).
duckdb = ["dep:duckdb"]

[dependencies]
csv.workspace = true
mssql-tds = { workspace = true, optional = true }
# DuckDB 1.5: 2.0 changed how static extensions link (it fails on aarch64 Linux).
duckdb = { version = "~1.10506", features = ["bundled"], optional = true }
futures.workspace = true
keyring-core.workspace = true
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile.workspace = true
url.workspace = true
