[package]
name = "datadrop-core"
description = "DataDrop core: connection profiles, SQL parsing and the commands shared by the CLI and the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
csv.workspace = true
futures.workspace = true
keyring-core.workspace = true
russh.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
url.workspace = true
