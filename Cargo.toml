[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/jabba2324/datadrop"
rust-version = "1.94"

[workspace.dependencies]
datadrop-core = { path = "crates/core" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
futures = "0.3"
keyring-core = "1"
mssql-tds = { version = "0.3", default-features = false }
rpassword = "7"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
