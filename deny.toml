# cargo-deny: run in CI (`cargo deny check`).

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability or unsound/yanked crate in the dependency tree.
yanked = "deny"
ignore = [
    # rsa (Marvin): non-constant-time RSA private-key operations. Pulled in by russh
    # for RSA SSH keys. SSH never decrypts with RSA, and DataDrop signs with the
    # user's own RSA key once per tunnel connection, far too few samples for a timing
    # attack over the network; Ed25519 keys don't use it at all. No fixed rsa
    # release yet.
    { id = "RUSTSEC-2023-0071", reason = "RSA only signs once per SSH connection; no decryption" },
    # zip 6 (extraction can keep setuid bits, or write through symlinks): a build dependency
    # of libduckdb-sys 1.5, used only to unpack a prebuilt libduckdb when
    # DUCKDB_DOWNLOAD_LIB=1. DataDrop builds DuckDB from source (`bundled`), so it never
    # extracts anything, and zip isn't in the shipped binaries. Remove with DuckDB 2.
    { id = "RUSTSEC-2026-0367", reason = "zip is a build dependency that never runs in a bundled build" },
    { id = "RUSTSEC-2026-0368", reason = "zip is a build dependency that never runs in a bundled build" },
    { id = "RUSTSEC-2026-0369", reason = "zip is a build dependency that never runs in a bundled build" },
    # zvariant, zvariant_derive and zbus_names: unmaintained as standalone crates since they merged into
    # zbus 6 (no vulnerability). Used by the GUI's screen-reader support (accesskit) and
    # Linux file dialogs (rfd -> ashpd) through zbus 5. Remove when those move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; waiting on accesskit/ashpd" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; waiting on accesskit/ashpd" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; waiting on accesskit/ashpd" },
]

[licenses]
# Permissive licences only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Boost (clipboard-win, error-code: the GUI's clipboard on Windows).
    "BSL-1.0",
    # The fonts egui embeds (epaint_default_fonts): free to bundle with software.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Public domain (tiny-keccak, under DuckDB's Arrow).
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
