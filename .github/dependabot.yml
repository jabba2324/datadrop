# Weekly pull requests for dependency updates (security fixes arrive as soon as they're
# published).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Patch releases are compatible, so they come as one PR. Minor and major updates
      # each get their own PR: for 0.x crates a minor bump is a breaking change, and one
      # that needs work shouldn't hold up the rest.
      rust-patches:
        update-types: ["patch"]
    ignore:
      # egui-notify and egui-phosphor each target one egui version, so the egui family
      # only moves when they do. Their own update PR (which fails until then) is the cue
      # to bump egui, eframe, egui_extras and egui_kittest together by hand.
      - dependency-name: "egui"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui_*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # DuckDB 2.0 (crate 1.20000) changed how static extensions link and breaks the
      # aarch64 Linux build; stay on 1.5 until that's sorted.
      - dependency-name: "duckdb"
        versions: [">= 1.10600"]
      - dependency-name: "libduckdb-sys"
        versions: [">= 1.10600"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
