name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI also runs for pull requests from forks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Known vulnerabilities (RustSec), licences and crate sources; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit and UI tests; the database tests skip themselves here (see below).
      - run: cargo test --workspace --all-features

  databases:
    name: Test against PostgreSQL, MySQL and SQL Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: shop
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only" --health-interval 2s --health-timeout 5s --health-retries 60
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only_2026!
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-only_2026!' -Q 'SELECT 1'"
          --health-interval 3s --health-timeout 10s --health-retries 60
    env:
      DATADROP_TEST_POSTGRES_URL: postgres://postgres:ci-only@127.0.0.1:5432/shop
      DATADROP_TEST_MYSQL_URL: mysql://root:ci-only@127.0.0.1:3306/shop
      DATADROP_TEST_MSSQL_URL: sqlserver://sa:Ci-only_2026%21@127.0.0.1:1433/master
      # The SSH tunnel tests: an SSH server in front of the same PostgreSQL.
      DATADROP_TEST_SSH_HOST: 127.0.0.1
      DATADROP_TEST_SSH_PORT: "2222"
      DATADROP_TEST_SSH_USER: dd
      DATADROP_TEST_SSH_PASSWORD: ci-only-ssh
      DATADROP_TEST_SSH_PASSPHRASE: ci-passphrase
      DATADROP_TEST_SSH_DB_URL: postgres://postgres:ci-only@host.docker.internal:5432/shop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start an SSH server for the tunnel tests
        run: |
          dir="$RUNNER_TEMP/ssh-test"
          mkdir -p "$dir"
          ssh-keygen -q -t ed25519 -N "" -f "$dir/id_plain"
          ssh-keygen -q -t ed25519 -N "$DATADROP_TEST_SSH_PASSPHRASE" -f "$dir/id_pass"
          cat "$dir/id_plain.pub" "$dir/id_pass.pub" > "$dir/authorized_keys"
          cp .github/ssh-test/Dockerfile "$dir/"
          docker build -q -t ssh-test --build-arg PASSWORD="$DATADROP_TEST_SSH_PASSWORD" "$dir"
          docker run -d --name ssh-test -p 127.0.0.1:2222:2222 \
            --add-host=host.docker.internal:host-gateway ssh-test
          echo "DATADROP_TEST_SSH_KEY=$dir/id_plain" >> "$GITHUB_ENV"
          echo "DATADROP_TEST_SSH_KEY_PASSPHRASE_FILE=$dir/id_pass" >> "$GITHUB_ENV"
      - run: cargo test --workspace --all-features
